sonar.projectKey=guilherme-teixeira-gomes_OficinaProjetoFiap
sonar.organization=guilherme-teixeira-gomes
sonar.projectName=oficina-api
sonar.projectVersion=1.0.0

# Diretórios fonte - APENAS serviços (domínios críticos)
sonar.sources=src/services
sonar.exclusions=**/*.spec.ts, **/*.test.ts

# Diretórios de testes
sonar.tests=src/services
sonar.test.inclusions=**/*.spec.ts, **/*.test.ts

# Cobertura
sonar.coverage.exclusions=**/*.spec.ts, **/*.test.ts

# Relatório de cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Host
sonar.host.url=https://sonarcloud.io