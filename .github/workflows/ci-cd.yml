name: CI/CD Pipeline

on:
  push:
    branches: [ main, fasetwo ]
  pull_request:
    branches: [ main, fasetwo ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/oficina-api

jobs:
  # ─── 1. Testes e build ───────────────────────────────────────────────────────
  test:
    name: Testes e Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

     - name: Executar testes unitários
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: oficina_test
          JWT_PASS: test-secret
        run: npx jest --testPathPattern=spec

      - name: Build TypeScript
        run: npm run build

  # ─── 2. Build e push da imagem Docker ────────────────────────────────────────
  docker-build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─── 3. Deploy no Kubernetes ─────────────────────────────────────────────────
  deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configurar kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Criar/atualizar Secret do Kubernetes
        run: |
          kubectl create secret generic oficina-secret \
            --from-literal=DB_PASS="${{ secrets.DB_PASS }}" \
            --from-literal=JWT_PASS="${{ secrets.JWT_PASS }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASS="${{ secrets.SMTP_PASS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap e manifestos do banco
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-service.yaml

      - name: Aguardar banco subir
        run: kubectl rollout status deployment/postgres --timeout=120s

      - name: Atualizar imagem da API
        run: |
          kubectl set image deployment/oficina-api \
            api=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Aplicar demais manifestos
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar deploy da API
        run: kubectl rollout status deployment/oficina-api --timeout=180s

      - name: Verificar pods em execução
        run: kubectl get pods -l app=oficina-api